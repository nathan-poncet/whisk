name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Build
        run: swift build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
