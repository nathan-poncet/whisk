name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Rule
        run: ./scripts/check-dependency-rule.sh
      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build
        run: swift build
      - name: Test with coverage
        shell: bash
        # Fails the build when line coverage of the testable code drops
        # under the minimum; see scripts/coverage.sh for what is measured.
        env:
          COVERAGE_MIN: 90
        run: ./scripts/coverage.sh | tee coverage-report.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            grep -E '^(Filename|TOTAL|Coverage gate)' coverage-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage-report.txt
            .build/coverage.lcov
