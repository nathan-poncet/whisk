name: App Store

# Builds the sandboxed Mac App Store variant, packages it and sends it to
# App Store Connect, where it waits in TestFlight until it is submitted.
# Run by hand: the Developer ID release on GitHub and Homebrew is the
# tag-driven one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version; empty means the latest tag
        required: false
        default: ""
      upload:
        description: Upload to App Store Connect after validating
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    env:
      SIGN_P12: ${{ secrets.APP_STORE_P12 }}
      SIGN_P12_PASSWORD: ${{ secrets.APP_STORE_P12_PASSWORD }}
      SIGN_IDENTITY_PREFIX: Apple Distribution
      INSTALLER_P12: ${{ secrets.APP_STORE_INSTALLER_P12 }}
      INSTALLER_P12_PASSWORD: ${{ secrets.APP_STORE_INSTALLER_P12_PASSWORD }}
      INSTALLER_IDENTITY_PREFIX: 3rd Party Mac Developer Installer
      PROFILE_B64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE }}
      ASC_KEY_P8_B64: ${{ secrets.NOTARY_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      # One number per run, always higher than the last: the store wants
      # every upload of a version to carry a new build number.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dependency Rule
        run: ./scripts/check-dependency-rule.sh

      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Test
        run: swift test

      - name: Keep crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

      - name: Import signing identities
        run: ./scripts/ci-import-signing-identity.sh

      - name: Resolve the version, the profile and the key
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          test -n "$PROFILE_B64" || { echo "APP_STORE_PROVISIONING_PROFILE secret missing" >&2; exit 1; }
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/whisk.provisionprofile"
          echo "PROVISIONING_PROFILE=$RUNNER_TEMP/whisk.provisionprofile" >> "$GITHUB_ENV"
          test -n "$ASC_KEY_P8_B64" || { echo "NOTARY_API_KEY_P8 secret missing" >&2; exit 1; }
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, package and ${{ inputs.upload && 'upload' || 'validate' }}
        run: ./scripts/build-appstore-pkg.sh "$VERSION" ${{ inputs.upload && 'upload' || 'validate' }}

      - uses: actions/upload-artifact@v7
        with:
          name: Whisk-${{ env.VERSION }}-appstore-pkg
          path: dist/Whisk.pkg
