name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      SIGN_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      SIGN_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Rule
        run: ./scripts/check-dependency-rule.sh

      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Test
        run: swift test

      # A release is signed and notarized or it does not ship: a missing
      # secret fails the job rather than shipping an ad-hoc build.
      - name: Import signing certificate
        run: |
          set -euo pipefail
          test -n "$SIGN_P12" || { echo "DEVELOPER_ID_P12 secret missing" >&2; exit 1; }
          echo "$SIGN_P12" | base64 --decode > signing.p12
          security create-keychain -p ci-keychain build.keychain
          # No auto-lock: the universal build runs longer than the default.
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '" ')
          # Apple's Developer ID intermediates complete the chain codesign needs.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSLo "$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$ca.cer" -k build.keychain
            rm "$ca.cer"
          done
          security import signing.p12 -k build.keychain -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain build.keychain > /dev/null
          rm signing.p12
          echo "CODESIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: ./scripts/build-app.sh "${GITHUB_REF_NAME#v}" universal

      - name: Smoke test the packaged app
        run: |
          codesign --verify --strict --verbose=2 dist/Whisk.app
          ./dist/Whisk.app/Contents/MacOS/Whisk --smoke-test | grep -q "smoke test passed"

      - name: Notarize and staple the app
        run: |
          set -euo pipefail
          test -n "$NOTARY_KEY" || { echo "NOTARY_API_KEY_P8 secret missing" >&2; exit 1; }
          echo "$NOTARY_KEY" | base64 --decode > notary.p8
          ditto -c -k --keepParent dist/Whisk.app notarize-app.zip
          xcrun notarytool submit notarize-app.zip \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/Whisk.app
          spctl -a -vv -t exec dist/Whisk.app
          rm notarize-app.zip

      - name: Zip app
        run: ditto -c -k --keepParent dist/Whisk.app "dist/Whisk-${GITHUB_REF_NAME}.zip"

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Notarize and staple the DMG
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/Whisk.dmg \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/Whisk.dmg
          rm notary.p8

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the version's CHANGELOG section; a version without
        # one falls back to GitHub's generated notes.
        run: |
          if ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Whisk-${GITHUB_REF_NAME}.zip" \
            "dist/Whisk.dmg" \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}"

      - name: Bump Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 dist/Whisk.dmg | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/nathan-poncet/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e "s|^  version .*|  version \"${VERSION}\"|" \
            -e "s|^  sha256 .*|  sha256 \"${SHA}\"|" \
            Casks/whisk.rb
          git config user.name "Nathan Poncet"
          git config user.email "112613712+nathan-poncet@users.noreply.github.com"
          git commit -am "whisk ${VERSION}"
          git push
